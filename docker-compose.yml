version: '3.9'
services:
  app:
    build: .
    container_name: cv_backend_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
  db:
    image: postgres:15-alpine
    container_name: cv_backend_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cv_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
